name: Build test APK

# Builds a sideload Slate.apk with Google's official Android SDK on GitHub's runners.
# This is a TEST build for your own phone, not the Play upload (that still uses build-play.sh and your upload key).
on:
  push:
    branches: ['slate-v2-visuals-archive', 'main']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }

      - name: Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "BT=$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_ENV"
          echo "AJ=$ANDROID_HOME/platforms/android-36/android.jar" >> "$GITHUB_ENV"

      # The test signing key is kept in the Actions cache, never in git, so every build can update the last one in place.
      - name: Restore test signing key
        uses: actions/cache@v4
        with:
          path: ~/.slate-test-key
          key: slate-test-signing-key-v1

      - name: Create test signing key if missing
        run: |
          mkdir -p ~/.slate-test-key
          [ -f ~/.slate-test-key/test.jks ] || keytool -genkeypair -keystore ~/.slate-test-key/test.jks -storepass slatetest -keypass slatetest \
            -alias slatetest -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Slate test build"

      - name: Build and sign
        run: |
          set -e
          V=$((100 + GITHUB_RUN_NUMBER)); B=/tmp/b; mkdir -p $B/classes $B/dex
          javac -source 8 -target 8 -bootclasspath "$AJ" -d $B/classes app/src/main/java/com/kaybuilds/slate/*.java
          "$BT/d8" --min-api 26 --lib "$AJ" --output $B/dex $(find $B/classes -name '*.class')
          sed "s#<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">#<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\" package=\"com.kaybuilds.slate\" android:versionCode=\"$V\" android:versionName=\"2.0.$V\"><uses-sdk android:minSdkVersion=\"29\" android:targetSdkVersion=\"36\" />#" app/src/main/AndroidManifest.xml > $B/AndroidManifest.xml
          "$BT/aapt2" compile --dir app/src/main/res -o $B/res.zip
          "$BT/aapt2" link -o $B/unsigned.apk -I "$AJ" --manifest $B/AndroidManifest.xml -A app/src/main/assets --min-sdk-version 29 --target-sdk-version 36 $B/res.zip
          (cd $B/dex && zip -q ../unsigned.apk classes.dex)
          "$BT/zipalign" -f -p 4 $B/unsigned.apk $B/aligned.apk
          "$BT/apksigner" sign --ks ~/.slate-test-key/test.jks --ks-pass pass:slatetest --key-pass pass:slatetest --ks-key-alias slatetest --out Slate.apk $B/aligned.apk
          "$BT/apksigner" verify Slate.apk
          "$BT/aapt2" dump badging Slate.apk | head -3
          echo "V=$V" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with: { name: Slate-apk, path: Slate.apk }

      - name: Publish as a release (downloadable on your phone)
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "test-$V" Slate.apk --target "$GITHUB_SHA" --prerelease --title "Slate test build $V" --notes "Sideload test build from ${GITHUB_REF_NAME}. Not the Play Store build."

      - name: Also keep the APK on the builds branch
        run: |
          git config user.name "slate-ci"; git config user.email "ci@users.noreply.github.com"
          mkdir -p /tmp/pub && cp Slate.apk /tmp/pub/Slate.apk && cd /tmp/pub && git init -q -b builds && git add -f Slate.apk && git commit -qm "Test build $V" \
            && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" builds
